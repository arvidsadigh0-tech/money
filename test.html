function coins(v){const u=S.goal/10,full=Math.min(10,Math.max(0,Math.floor(v/u))),part=full<10?Math.max(0,Math.min(1,(v-full*u)/u)):0;

<label for="np1">رمز جدید</label><input id="np1" type="password" autocomplete="new-password" dir="ltr" required minlength="6">
<label for="np2">تکرار رمز جدید</label><input id="np2" type="password" autocomplete="new-password" dir="ltr" required minlength="6">
<div class="er" role="alert" aria-live="polite"></div>
<div class="r"><button class="p" type="submit">ذخیرهٔ رمز جدید</button></div></form>`;
  document.body.appendChild(l);
  const f = l.querySelector('form'), er = l.querySelector('.er');
  f.onsubmit = async e => { e.preventDefault(); const a = l.querySelector('#np1').value, b = l.querySelector('#np2').value;
    if (a !== b) { er.textContent = 'دو رمز یکی نیستند؛ دوباره بنویس.'; return; }
    l.querySelectorAll('button').forEach(x => x.disabled = true); er.textContent = '';
    const r = await sb.auth.updateUser({ password: a }); l.querySelectorAll('button').forEach(x => x.disabled = false);
    if (r.error) { er.textContent = fa(r.error); return; }
    pvSave(a); hideLogin(); msg = '✅ رمز عوض شد؛ از این به بعد با رمز جدید وارد شو.'; draw(); };
}
// sign-out: make sure the cloud already holds this device's latest change, then remove the device copy
// (so the next person at a shared computer sees nothing). Nothing is removed if the cloud is not up to date.
// Only an unsent local change is written — the same write a save would do — so a newer cloud copy is never overwritten.
async function signOut() {
  if (CONFLICT) { msg = '⚠️ اول بالای صفحهٔ خانه انتخاب کنید کدام نسخه بماند، بعد خارج شوید.'; return draw(); }
  if (!hyd) { msg = '⏳ هنوز با فضای ابری هماهنگ نشده؛ چند ثانیه بعد دوباره «خروج» را بزنید.'; return draw(); }
  clearTimeout(tm); await cw;
  if ((S.at || 0) !== lastSync()) { cloudWrite(); await cw; }
  if ((S.at || 0) !== lastSync()) { msg = '⚠️ آخرین تغییرات هنوز در فضای ابری ذخیره نشده، پس اطلاعات این دستگاه پاک نشد. اینترنت را وصل کنید و دوباره «خروج» را بزنید.'; return draw(); }
  await sb.auth.signOut();
  // device-only display keys (milestones / payback notices already shown) stay; everything holding money data goes
  try { Object.keys(localStorage).filter(k => /^moneytest/.test(k) && !/^moneytest_(ms|payok|lang)$/.test(k)).forEach(k => localStorage.removeItem(k)); } catch (e) {}
  try { sessionStorage.setItem('signedout', '1'); } catch (e) {}
  location.reload();
}
window.showLogin = showLogin; window.signOut = signOut;
// account card at the top of the Finance page
const setPage = V.set;
V.set = () => `<div class="c"><h3>حساب</h3>${UID ? `<div class="r"><span>وارد شده با <b dir="ltr">${E(EMAIL)}</b></span><button onclick="signOut()">خروج</button></div><small>با «خروج» اطلاعات از همین دستگاه پاک می‌شود و در فضای ابری می‌ماند؛ با ورود دوباره برمی‌گردد.</small>` : `<div class="r"><span class="mu">وارد نشده‌اید؛ داده‌ها فقط روی همین دستگاه‌اند.</span><button class="p" onclick="showLogin()">ورود</button></div>`}</div>` + setPage();
// offline, Supabase keeps retrying an expired token for ~30 s; don't wait for it when there is no network or it is slow
const t0 = navigator.onLine ? Promise.race([sb.auth.getSession(), new Promise(r => setTimeout(() => r({ data: { session: null }, error: { name: 'AuthRetryableFetchError', message: 'timeout' } }), 4000))])
  : Promise.resolve({ data: { session: null }, error: { name: 'AuthRetryableFetchError', message: 'offline' } });
let { data: { session }, error: se } = await t0;
// no network and an expired token: Supabase keeps the stored sign-in, so open on this device's copy; changes sync when back online
if (!session && !REC) { const u = storedUser(); if (u && (!navigator.onLine || isNet(se))) session = { user: u }; }
addEventListener('online', () => { if (UID && !CONFLICT) sync().then(() => { if (!document.activeElement || !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) draw(); }); });
if (REC) history.replaceState(null, '', location.pathname);   // keep the one-time link out of the address bar
if (session) {
  EMAIL = session.user.email || '';
  if (REC) unlock(); else if (tooLong()) showLock(); else unlock();   // lock first, so it is up before the cloud copy arrives
  await start(session.user); if (REC) showNewPw();
  else if (isLocked() && !document.getElementById('sgn')) showLock();   // start() clears overlays; put the lock back
}
else if (REC) { showLogin(); const er = document.querySelector('#sgn .er'); if (er) er.textContent = 'لینک تغییر رمز منقضی شده یا قبلاً استفاده شده؛ دوباره «رمز را فراموش کردم» را بزن.'; }
else if (top === self) showLogin();   // inside the test runner's frame the screen stays out of the way
</script>
